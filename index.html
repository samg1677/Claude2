<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EduConnect USA — Mega Menu Demo</title>
<link rel="stylesheet" href="divi-css-box.css" />
<style>
  body { margin: 0; font-family: 'Open Sans', Arial, sans-serif; color: #686868; background: #f6f9fb; }
  .demo-hero { padding: 120px 24px 80px; text-align: center; max-width: 880px; margin: 0 auto; }
  .demo-hero h1 { font-family: 'Roboto', sans-serif; color: #2a2f31; font-size: 42px; margin: 0 0 16px; }
  .demo-hero p  { font-size: 18px; line-height: 1.7; }
  .demo-hero .pill { display: inline-block; padding: 6px 14px; border-radius: 999px; background: #e8f7f5; color: #00607d; font-weight: 600; font-size: 13px; letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 20px; }
</style>
</head>
<body>

<!-- The header HTML lives in divi-html-box.html. We inline-include it via
     a small script so this preview matches what you'll paste into Divi. -->
<div id="ec-mount"></div>
<script>
  fetch('divi-html-box.html').then(function(r){ return r.text(); }).then(function(html){
    document.getElementById('ec-mount').innerHTML = html;
    // re-execute the embedded <script> tag so the menu behavior runs
    var scripts = document.getElementById('ec-mount').querySelectorAll('script');
    scripts.forEach(function(s){
      var n = document.createElement('script');
      n.textContent = s.textContent;
      document.body.appendChild(n);
    });
  });
</script>

<main>
  <section class="demo-hero">
    <span class="pill">Mega Menu Preview</span>
    <h1>Hover (or tap) any nav item to see the mega menu in action.</h1>
    <p>Two files only: paste <strong>divi-html-box.html</strong> into a Divi Code module, paste <strong>divi-css-box.css</strong> into Divi → Theme Options → Custom CSS. Try resizing the browser.</p>
  </section>
</main>

</body>
</html>
